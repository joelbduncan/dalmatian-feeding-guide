# ---------------------------------------------------------------------------
# Dalmatian Diet: dalmatiandiet.org
# The old domain, dalmatian-feeding-guide.org, permanently redirects here,
# keeping the path, so old links and search results still work.
# ---------------------------------------------------------------------------

# HTTP: send every domain to https://dalmatiandiet.org
server {
        listen 80;
        server_name dalmatiandiet.org www.dalmatiandiet.org
                    dalmatian-feeding-guide.org www.dalmatian-feeding-guide.org;
        return 301 https://dalmatiandiet.org$request_uri;
}

# HTTPS, old domain: redirect to the new one.
# Keep this certificate renewed for as long as the old domain is registered.
server {
        listen 443 ssl http2;
        server_name dalmatian-feeding-guide.org www.dalmatian-feeding-guide.org;

        ssl_certificate         /etc/nginx/ssl/dalmatian-feeding-guide-org-certificate.pem;
        ssl_certificate_key     /etc/nginx/ssl/dalmatian-feeding-guide-org-key.pem;
        ssl_protocols           TLSv1.2 TLSv1.3;

        return 301 https://dalmatiandiet.org$request_uri;
}

# HTTPS, www: redirect to the bare domain.
server {
        listen 443 ssl http2;
        server_name www.dalmatiandiet.org;

        ssl_certificate         /etc/nginx/ssl/dalmatiandiet-org-certificate.pem;
        ssl_certificate_key     /etc/nginx/ssl/dalmatiandiet-org-key.pem;
        ssl_protocols           TLSv1.2 TLSv1.3;

        return 301 https://dalmatiandiet.org$request_uri;
}

# HTTPS: the site itself
server {
        listen 443 ssl http2;
        server_name dalmatiandiet.org;

        ssl_certificate         /etc/nginx/ssl/dalmatiandiet-org-certificate.pem;
        ssl_certificate_key     /etc/nginx/ssl/dalmatiandiet-org-key.pem;
        ssl_protocols           TLSv1.2 TLSv1.3;
        ssl_session_cache       shared:DFG_SSL:10m;
        ssl_session_timeout     1d;

        # The web root is the project's public/ folder. content/, templates/,
        # lib/ and config.php sit one level up and can't be reached directly.
        root /var/nginx-web/dalmatian-feeding-guide/public;
        index index.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
                root /usr/share/nginx/html;
        }

        # Real files are served directly; everything else goes to the router,
        # which also handles 404s and redirects old .php URLs.
        location / {
                try_files $uri /index.php$is_args$args;
        }

        # Only the front controller ever runs as PHP.
        location ~ \.php$ {
                try_files /index.php =404;
                fastcgi_pass unix:/run/php/php-fpm.sock;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root/index.php;
                fastcgi_param SCRIPT_NAME /index.php;
        }

        # Block hidden files such as .htaccess and .git.
        location ~ /\. {
                deny all;
        }

        location ~* \.(woff2?|eot|ttf|svg|mp4|webm|jpg|jpeg|png|gif|webp|avif|ico|css|js|xml|txt)$ {
                access_log off;
                log_not_found off;
                expires 365d;
                add_header Cache-Control "public";
                add_header X-Content-Type-Options "nosniff" always;
        }

        location /nginx_srv_status {
                stub_status on;
                access_log off;
                allow all;
        }
}
